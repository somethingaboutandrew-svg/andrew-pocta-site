# Static site: no build step. Netlify publishes the repo root as-is.
[build]
  publish = "."
  command = ""

# Keep the editing/developer files out of the public site.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/"
  status = 404
  force = true
